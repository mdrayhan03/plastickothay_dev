name: backend-ci

on:
  push:
    paths: ["plastickothay_dev/backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["plastickothay_dev/backend/**"]

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plastickothay_dev/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -q -r requirements-dev.txt
      - name: Import boundary (core stays framework-free)
        run: lint-imports
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
